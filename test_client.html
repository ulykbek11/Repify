<!DOCTYPE html>
<html>
<head>
    <title>MotionIQ Test Client</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; }
        #video-container { position: relative; display: inline-block; margin-top: 20px; }
        video { border: 2px solid #333; border-radius: 8px; transform: scaleX(-1); }
        #overlay { position: absolute; top: 10px; left: 10px; text-align: left; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 4px; }
        .good { color: #0f0; }
        .bad { color: #f00; }
        .btn { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; background: #f57c00; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>MotionIQ MVP</h1>
    <div>
        <button class="btn" onclick="startExercise('squat')">Start Squat</button>
        <button class="btn" onclick="startExercise('deadlift')">Start Deadlift</button>
    </div>
    
    <div id="video-container">
        <video id="video" width="640" height="480" autoplay playsinline></video>
        <div id="overlay">
            <h2 id="feedback">Select Exercise</h2>
            <p>Angle: <span id="angle">-</span></p>
            <p>Score: <span id="score">-</span></p>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const feedbackEl = document.getElementById('feedback');
        const angleEl = document.getElementById('angle');
        const scoreEl = document.getElementById('score');
        let ws = null;
        let intervalId = null;

        async function setupCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => resolve(video);
            });
        }

        async function startExercise(exercise) {
            if (ws) ws.close();
            if (intervalId) clearInterval(intervalId);

            await setupCamera();

            ws = new WebSocket(`ws://localhost:8000/ws/${exercise}`);
            
            ws.onopen = () => {
                console.log(`Connected to ${exercise}`);
                feedbackEl.innerText = "Connected...";
                
                const canvas = document.createElement('canvas');
                canvas.width = 640;
                canvas.height = 480;
                const ctx = canvas.getContext('2d');

                intervalId = setInterval(() => {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const data = canvas.toDataURL('image/jpeg', 0.8);
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send(data);
                    }
                }, 100); // 10 FPS
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                // Update UI
                if (data.status === "Analyzed") {
                    feedbackEl.innerText = data.feedback;
                    feedbackEl.className = data.is_correct ? "good" : "bad";
                    
                    let anglesText = "";
                    for (const [key, val] of Object.entries(data.angles)) {
                        anglesText += `${key}: ${val}° `;
                    }
                    angleEl.innerText = anglesText;
                    scoreEl.innerText = (data.probability * 100).toFixed(1) + "%";
                } else {
                    feedbackEl.innerText = data.feedback;
                    feedbackEl.className = "";
                }
            };
        }
    </script>
</body>
</html>
