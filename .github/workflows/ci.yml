name: CI

on:
  push:
    branches: [main, "fix/**", "chore/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (syntax errors and unused names)
        run: ruff check --select E9,F app tests scripts
      - name: Tests
        run: pytest -q
      - name: Bundled demo samples are up to date
        run: python scripts/export_samples.py && git diff --exit-code -- ../frontend/src/data/samples.json

  app:
    name: App (lint and web export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Export the web build (demo mode)
        run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: ""
