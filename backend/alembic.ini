# Alembic Configuration

[alembic]
# Путь к скриптам миграций
script_location = alembic

# Шаблон имени файла миграции
file_template = %%(rev)s_%%(slug)s

# Формат даты
# file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(slug)s

# Часовой пояс (по умолчанию UTC)
# timezone =

# Максимальная длина slug
truncate_slug_length = 40

# Добавлять 'revision down' в миграции
# revision_environment = false

# Подключение к БД — берётся из env.py
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Поддерживаемые хуки: Black formatter и т.д.

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
