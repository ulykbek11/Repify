<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подтвердите регистрацию в Repify</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #333333;
      margin: 0;
      padding: 0;
      background-color: #0A0E1A;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    .header {
      text-align: center;
      padding: 30px 0;
    }
    .logo-text {
      color: #FFFFFF;
      font-size: 28px;
      font-weight: bold;
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .content {
      background-color: #1A1F2E;
      padding: 40px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }
    h1 {
      color: #FFFFFF;
      font-size: 24px;
      margin-bottom: 20px;
    }
    p {
      color: #8B8E98;
      font-size: 16px;
      margin-bottom: 30px;
    }
    .button {
      display: inline-block;
      background-color: #FF6B00;
      color: #FFFFFF;
      padding: 14px 32px;
      text-decoration: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }
    .button:hover {
      background-color: #E66000;
    }
    .footer {
      text-align: center;
      padding: 30px 0;
      color: #666666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="{{ .SiteURL }}" class="logo-text">Repify</a>
    </div>
    <div class="content">
      <h1>Добро пожаловать в команду! 🚀</h1>
      <p>Вы всего в одном шаге от начала тренировок. Пожалуйста, подтвердите ваш email, нажав на кнопку ниже:</p>
      <a href="{{ .ConfirmationURL }}" class="button">Подтвердить Email</a>
      <p style="margin-top: 30px; font-size: 14px;">Если вы не регистрировались в Repify, просто проигнорируйте это письмо.</p>
    </div>
    <div class="footer">
      &copy; 2024 Repify. Твой путь к совершенству.
    </div>
  </div>
</body>
</html>
